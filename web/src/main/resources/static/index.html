<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генерация блок-схемы</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        #diagramCanvas { width: 100%; height: 500px; background:#111; border:1px solid #333; }
    </style>
    <script src="/js/auth-check.js" defer></script>
</head>
<body>

<div class="container-fluid p-3 border-bottom d-flex justify-content-between align-items-center">
    <h4 class="m-0">Блок-Схема</h4>
    <button id="logoutBtn" class="btn btn-danger">Выйти из аккаунта</button>
</div>

<div class="container-fluid mt-3">
    <div class="row">

        <!-- Левая панель -->
        <div class="col-md-5">
            <div class="card mb-3">
                <div class="card-header fw-bold">Input</div>
                <div class="card-body">
                    <textarea id="inputCode" class="form-control" rows="18" placeholder="Paste your code here..."></textarea>
                    <button id="generateBtn" class="btn btn-dark w-100 mt-3">Generate Flowchart →</button>
                </div>
            </div>

            <!-- История слева -->
            <div class="card mt-4">
                <div class="card-header fw-bold">Diagram History</div>
                <ul id="historyList" class="list-group list-group-flush" style="max-height: 300px; overflow-y: auto;"></ul>
            </div>
        </div>

        <!-- Правая панель -->
        <div class="col-md-7">
            <div class="card mb-3">
                <div class="card-header d-flex justify-content-between align-items-center fw-bold">
                    Flowchart Output
                    <button id="downloadBtn" class="btn btn-success btn-sm d-none">PNG</button>
                </div>
                <div class="card-body bg-dark">
                    <canvas id="diagramCanvas"></canvas>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
    const canvas = document.getElementById("diagramCanvas");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
      canvas.width = canvas.clientWidth;
      canvas.height = 500;
    }

    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    document.getElementById("generateBtn").addEventListener("click", () => {
      const code = document.getElementById("inputCode").value;
      if (!code.trim()) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#007bff";
      ctx.fillRect(50, 50, 200, 80);

      ctx.fillStyle = "white";
      ctx.font = "16px Arial";
      ctx.fillText("Пример блок-схемы", 60, 95);

      document.getElementById("downloadBtn").classList.remove("d-none");

      const now = new Date();
      const item = document.createElement("li");
      item.className = "list-group-item";
      item.textContent = `${now.toLocaleTimeString()} — ${code.slice(0, 20)}...`;
      document.getElementById("historyList").prepend(item);
    });
    document.getElementById("logoutBtn").onclick = async () => {
        await fetch("http://localhost:8081/logout", {
            method: "POST",
            credentials: 'include'
        });
        window.location.href = "/login.html";
    };
    document.getElementById("downloadBtn").addEventListener("click", () => {
      const link = document.createElement('a');
      link.download = "diagram.png";
      link.href = canvas.toDataURL();
      link.click();
    });
</script>

</body>
</html>
