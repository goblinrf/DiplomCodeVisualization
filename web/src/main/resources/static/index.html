<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генерация блок-схемы</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

<div class="container-fluid p-3 border-bottom d-flex justify-content-between align-items-center">
    <h4 class="m-0">Блок-Схема</h4>
    <button id="logoutBtn" class="btn btn-danger">Выйти из аккаунта</button>
</div>

<div class="container-fluid mt-3">
    <div class="row">

        <!-- Левая панель -->
        <div class="col-md-5">
            <div class="card mb-3">
                <div class="card-header fw-bold">Input</div>
                <div class="card-body">
                    <textarea id="inputCode" class="form-control" rows="18" placeholder="Paste your code here..."></textarea>
                    <button id="generateBtn" class="btn btn-dark w-100 mt-3">Generate Flowchart →</button>
                </div>
            </div>

            <!-- История -->
            <div class="card mt-4">
                <div class="card-header fw-bold">Diagram History</div>
                <ul id="historyList" class="list-group list-group-flush" style="max-height: 300px; overflow-y: auto;"></ul>
            </div>
        </div>

        <!-- Правая панель -->
        <div class="col-md-7">
            <div class="card mb-3">
                <div class="card-header d-flex justify-content-between align-items-center fw-bold">
                    Flowchart Output
                    <button id="downloadBtn" class="btn btn-success btn-sm d-none">PNG</button>
                </div>

                <div class="card-body bg-dark">
                    <!-- ВАЖНО: canvas заменён на этот div -->
                    <div id="diagramOutput"
                         class="bg-dark p-2"
                         style="min-height: 500px; overflow: auto; color: white;">
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
    const outputDiv = document.getElementById("diagramOutput");

    document.getElementById("generateBtn").addEventListener("click", async () => {
        const code = document.getElementById("inputCode").value.trim();
        if (!code) return;

        outputDiv.innerHTML = "<p class='text-light'>Генерация...</p>";

        try {
            const response = await fetch("http://localhost:8083/api/blockschema/generate", {
                method: "POST",
                headers: { "Content-Type": "text/plain" },
                body: code,
                credentials: "include"
            });

            if (!response.ok) {
                const err = await response.text();
                outputDiv.innerHTML = `<p class='text-danger'>Ошибка: ${err}</p>`;
                return;
            }

            const svgText = await response.text();
            outputDiv.innerHTML = svgText;

            document.getElementById("downloadBtn").classList.remove("d-none");

            const now = new Date();
            const item = document.createElement("li");
            item.className = "list-group-item";
            item.textContent = `${now.toLocaleTimeString()} — ${code.slice(0, 20)}...`;
            document.getElementById("historyList").prepend(item);

        } catch (e) {
            outputDiv.innerHTML = `<p class='text-danger'>Ошибка: ${e}</p>`;
        }
    });

    // ---- PNG Export ----
    document.getElementById("downloadBtn").addEventListener("click", () => {
        const svgElement = outputDiv.querySelector("svg");
        if (!svgElement) return;

        const svgData = new XMLSerializer().serializeToString(svgElement);
        const svgBlob = new Blob([svgData], { type: "image/svg+xml;charset=utf-8" });
        const url = URL.createObjectURL(svgBlob);

        const img = new Image();
        img.onload = function () {
            const canvas = document.createElement("canvas");
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0);

            const link = document.createElement("a");
            link.download = "diagram.png";
            link.href = canvas.toDataURL("image/png");
            link.click();

            URL.revokeObjectURL(url);
        };
        img.src = url;
    });

    // Logout
    document.getElementById("logoutBtn").onclick = async () => {
        await fetch("http://localhost:8081/logout", {
            method: "POST",
            credentials: 'include'
        });
        window.location.href = "/login.html";
    };
</script>

</body>
</html>
